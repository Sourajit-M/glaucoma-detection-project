services:
  backend:
    build: ./backend
    image: glaucoma-backend
    ports:
      - "8000:8000"
    env_file: ./backend/.env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r = urllib.request.urlopen('http://localhost:8000/health'); raise SystemExit(0 if 200 <= r.status < 300 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build: ./frontend
    image: glaucoma-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy